name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Scan for secrets and absolute Windows paths
        run: |
          set -e
          if grep -rnE 'sk-[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{35}|gsk_[a-zA-Z0-9]{20,}' . \
            --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.md' --include='*.txt' \
            | grep -vE '\.example\.|requirements\.txt|\.github/'; then
            echo "::error::Secret pattern detected in tracked files"
            exit 1
          fi
          if grep -rnE '[A-Z]:\\\\' . \
            --include='*.py' | grep -vE '#|"""|placeholder|docstring|comment'; then
            echo "::error::Absolute Windows path detected in Python source"
            exit 1
          fi
          echo "No secrets or absolute Windows paths found."
